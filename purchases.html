<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة مشتريات - تك ستور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="navbar.css?v=13.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --success: #10b981;
            --bg: #f3f4f6;
            --panel: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100vh;
            overflow: hidden;
            width: 100%;
        }

        body {
            background-color: var(--bg);
            display: flex;
            flex-direction: row;
            color: var(--text);
        }

        .page-container {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            /* يمنع السكرول العرضي للصفحة */
            padding: 2rem;
            position: relative;
        }

        .page-header {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px 25px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: white;
            border-color: var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: #f9fafb;
        }

        .erp-document {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .erp-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 30px;
        }

        .form-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            align-items: center;
        }

        .form-group label {
            width: 140px;
            font-weight: 700;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-control {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-bottom: 1px solid var(--border);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: transparent;
            color: var(--text);
            font-weight: 600;
            width: 100%;
        }

        .form-control:focus {
            border-bottom-color: var(--primary);
        }

        select.form-control {
            cursor: pointer;
        }

        .search-row {
            margin-bottom: 15px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: #f9fafb;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: white;
        }

        #searchResults {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            z-index: 1000;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .search-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
            transition: 0.2s;
        }

        .search-item:hover {
            background: #f0fdf4;
            color: var(--success);
            font-weight: bold;
        }

        /* 💡 حاوية الجدول للسكرول في الموبايل */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 30px;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
            /* تمنع انكماش الجدول */
        }

        th {
            background: #f8fafc;
            border-bottom: 2px solid var(--border);
            padding: 12px;
            text-align: right;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .line-input {
            width: 100%;
            padding: 8px;
            border: 1px solid transparent;
            border-radius: 6px;
            text-align: left;
            font-weight: bold;
            outline: none;
            transition: 0.2s;
            min-width: 70px;
        }

        .line-input:focus {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .line-input::placeholder {
            color: #cbd5e1;
            font-weight: normal;
        }

        .text-right {
            text-align: right !important;
        }

        .text-left {
            text-align: left !important;
        }

        .erp-bottom {
            display: flex;
            justify-content: space-between;
            gap: 40px;
        }

        .notes-section {
            flex: 1;
        }

        .notes-section textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: none;
            outline: none;
            font-family: 'Cairo';
        }

        .notes-section textarea:focus {
            border-color: var(--primary);
        }

        .totals-section {
            width: 350px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.95rem;
        }

        .total-row.grand {
            font-size: 1.4rem;
            font-weight: 900;
            border-bottom: none;
            border-top: 2px solid var(--text);
            margin-top: 10px;
            padding-top: 15px;
        }

        .total-input {
            width: 100px;
            text-align: left;
            border: none;
            border-bottom: 1px solid var(--border);
            outline: none;
            font-weight: bold;
            padding: 4px;
            background: transparent;
        }

        .total-input:focus {
            border-color: var(--primary);
            background: white;
            border-radius: 4px;
        }

        .total-input::placeholder {
            color: #cbd5e1;
            font-weight: normal;
        }

        /* الزرار العائم السحري */
        .floating-confirm-btn {
            position: fixed;
            bottom: 30px;
            right: 270px;
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 2000;
            border: none;
            opacity: 0;
            visibility: hidden;
            transform: translateY(30px) scale(0.9);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-confirm-btn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .floating-confirm-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.6);
        }

        /* =======================================================
           📱 الميديا كويري (Responsive) للموبايل والتابلت
           ======================================================= */
        @media (max-width: 950px) {

            html,
            body {
                overflow-x: hidden !important;
                /* 💡 يمنع الصفحة من السحب يمين وشمال */
                overflow-y: auto !important;
                /* يسمح بالسكرول تحت وفوق للوصول لباقي الفاتورة */
                height: auto;
                width: 100%;
            }

            .page-container {
                padding: 80px 10px 20px 10px !important;
                /* مسافة للزرار العائم فوق */
                height: auto;
                overflow: visible;
                width: 100%;
                box-sizing: border-box;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .header-actions .btn {
                flex: 1;
                justify-content: center;
                min-width: 120px;
                /* عشان لو الزراير كترت تنزل سطر جديد */
            }

            .erp-document {
                padding: 15px 10px;
                /* تقليل البادينج ليناسب الموبايل */
                width: 100%;
                box-sizing: border-box;
            }

            .erp-form-grid {
                grid-template-columns: 1fr;
                /* المورد والتاريخ تحت بعض */
                gap: 15px;
                margin-bottom: 20px;
            }

            .form-group {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 5px;
                width: 100%;
            }

            .form-group label {
                width: 100%;
                margin-bottom: 5px;
            }

            .erp-bottom {
                flex-direction: column;
                gap: 20px;
            }

            .totals-section {
                width: 100%;
            }

            /* 💡 السر هنا: ده بيجبر الحاوية إنها تحترم العرض وتعمل سكرول للي جواها بس */
            .table-responsive {
                display: block;
                width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                border: 1px solid var(--border);
                /* يبروز الجدول في الموبايل */
                border-radius: 8px;
            }

            table {
                min-width: 750px;
                /* نثبت عرض الجدول عشان الداتا متبوظش جوا الموبايل */
            }

            /* تظبيط مكان الزرار العائم في الموبايل */
            .floating-confirm-btn {
                right: 50%;
                transform: translateX(50%) translateY(30px) scale(0.9);
                width: 90%;
                justify-content: center;
                bottom: 20px;
            }

            .floating-confirm-btn.show {
                transform: translateX(50%) translateY(0) scale(1);
            }
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .page-container,
            .page-container * {
                visibility: visible;
            }

            .page-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 0;
            }

            .sidebar,
            #navbar-container,
            .header-actions,
            .floating-confirm-btn {
                display: none !important;
            }

            .erp-document {
                border: 1px solid #000;
                box-shadow: none;
                break-inside: avoid;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>

    <main class="page-container" id="scrollContainer">

        <div class="page-header">
            <h1 class="page-title">
                <i class="bi bi-box-arrow-in-down" style="color: var(--primary);"></i>
                فاتورة مشتريات
                <span id="poNumber" style="color: var(--text-light); font-size: 1.3rem; font-weight: 600;">(جديد)</span>
            </h1>
            <div class="header-actions">
                <button class="btn btn-outline" style="color: var(--danger); border-color: #fecaca;"
                    onclick="clearForm()"><i class="bi bi-trash"></i> مسح</button>
                <button class="btn btn-outline" onclick="window.print()"><i class="bi bi-printer"></i> طباعة</button>
                <button id="mainSaveBtn" class="btn btn-primary" onclick="savePO()"><i class="bi bi-check-circle"></i>
                    تأكيد واستلام</button>
            </div>
        </div>

        <div class="erp-document">

            <div class="erp-form-grid">
                <div class="form-col">
                    <div class="form-group">
                        <label>المورد</label>
                        <select id="supplierSelect" class="form-control"
                            onchange="checkSupplier(); saveDraft();"></select>
                    </div>
                    <div class="form-group">
                        <label>مرجع المورد</label>
                        <input type="text" id="referenceNo" class="form-control" placeholder="رقم الفاتورة الورقية"
                            oninput="saveDraft()">
                    </div>
                    <div class="form-group">
                        <label>المخزن الوجهة</label>
                        <select id="warehouseSelect" class="form-control" onchange="saveDraft()">
                            <option value="المخزن الرئيسي">المخزن الرئيسي</option>
                            <option value="المعرض">المعرض</option>
                        </select>
                    </div>
                </div>

                <div class="form-col">
                    <div class="form-group">
                        <label>تاريخ الطلب</label>
                        <input type="date" id="orderDate" class="form-control" onchange="saveDraft()">
                    </div>
                    <div class="form-group">
                        <label>تاريخ الاستلام</label>
                        <input type="date" id="receiveDate" class="form-control" onchange="saveDraft()">
                    </div>
                    <div class="form-group" id="supplierBalanceDiv" style="display:none;">
                        <label>رصيد المورد (دائن)</label>
                        <span id="supplierBalanceLabel"
                            style="color: var(--danger); font-weight: bold; margin-right: 10px;">0.00</span>
                    </div>
                </div>
            </div>

            <div class="search-row">
                <input type="text" id="productSearch" class="search-input"
                    placeholder="أضف منتج... (ابحث بالاسم أو الكود)" autocomplete="off">
                <div id="searchResults"></div>
            </div>

            <div class="table-responsive">
                <table id="linesTable">
                    <thead>
                        <tr>
                            <th width="25%" style="text-align: right;">المنتج</th>
                            <th width="20%">الوصف</th>
                            <th width="10%" class="text-left">الكمية</th>
                            <th width="13%" class="text-left" style="color: var(--danger);">سعر الشراء</th>
                            <th width="13%" class="text-left" style="color: var(--success);">تحديث البيع</th>
                            <th width="13%" class="text-left">الإجمالي</th>
                            <th width="6%"></th>
                        </tr>
                    </thead>
                    <tbody id="poLinesBody"></tbody>
                </table>
            </div>

            <div class="erp-bottom">
                <div class="notes-section">
                    <textarea id="termsNotes" placeholder="أضف أي ملاحظات تخص فاتورة الاستلام..."
                        oninput="saveDraft()"></textarea>
                </div>

                <div class="totals-section">
                    <div class="total-row">
                        <span style="color: var(--text-light); font-weight: bold;">المبلغ غير الخاضع للضريبة:</span>
                        <span id="subTotal" style="font-weight: bold; color: var(--text);">0.00</span>
                    </div>
                    <div class="total-row">
                        <span style="color: var(--text-light); font-weight: bold;">الخصم / تسويات:</span>
                        <input type="number" id="discountInput" class="total-input text-left" placeholder="0" min="0"
                            oninput="calcTotals(); saveDraft();">
                    </div>
                    <div class="total-row">
                        <span style="color: var(--text-light); font-weight: bold;">الضرائب والتكاليف الإضافية:</span>
                        <input type="number" id="taxInput" class="total-input text-left" placeholder="0" min="0"
                            oninput="calcTotals(); saveDraft();">
                    </div>
                    <div class="total-row grand">
                        <span>الإجمالي:</span>
                        <span id="grandTotal">0.00</span>
                    </div>

                    <div class="total-row"
                        style="margin-top: 10px; border-top: 2px dashed var(--border); padding-top: 15px;">
                        <span style="color: var(--success); font-weight: 900;">المدفوع نقداً: <span
                                style="color:red">*</span></span>
                        <input type="number" id="paidInput" class="total-input text-left"
                            style="color: var(--success); font-size: 1.2rem; border-bottom: 2px solid var(--danger); width: 120px;"
                            placeholder="مطلوب" min="0" oninput="calcTotals(); saveDraft();">
                    </div>
                    <div class="total-row">
                        <span style="color: var(--danger); font-weight: 900;">الرصيد المستحق:</span>
                        <span id="dueAmount"
                            style="color: var(--danger); font-weight: 900; font-size: 1.1rem;">0.00</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <button id="floatingConfirmBtn" class="floating-confirm-btn" onclick="savePO()">
        <i class="bi bi-check-circle-fill" style="font-size: 1.3rem;"></i> تأكيد واستلام
    </button>

    <script src="navbar.js?v=13.0"></script>
    <script>
        let productsDB = JSON.parse(localStorage.getItem('pos_products')) || [];
        let contactsDB = JSON.parse(localStorage.getItem('pos_contacts')) || [];
        let purchasesDB = JSON.parse(localStorage.getItem('pos_purchases')) || [];
        let orderLines = [];

        window.onload = () => {
            const newId = purchasesDB.length > 0 ? purchasesDB[purchasesDB.length - 1].id + 1 : 1;
            document.getElementById('poNumber').innerText = `(INV-${String(newId).padStart(4, '0')})`;

            const supSelect = document.getElementById('supplierSelect');
            supSelect.innerHTML = '<option value="">-- حدد المورد --</option>';
            contactsDB.filter(c => c.type === 'مورد').forEach(s => {
                supSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });

            loadDraft();
            setupFloatingButtonObserver();

            // 💡 رادار الناف بار عشان المنيو تفضل مفتوحة
            const checkNavbar = setInterval(() => {
                const myLink = document.querySelector('a[href*="purchases.html"]');
                if (myLink) {
                    clearInterval(checkNavbar);
                    myLink.classList.add('active');

                    const parentMenu = myLink.closest('.dropdown-menu') || myLink.closest('ul');
                    if (parentMenu) {
                        parentMenu.style.display = 'flex';
                        parentMenu.style.flexDirection = 'column';
                        parentMenu.style.visibility = 'visible';
                        parentMenu.style.opacity = '1';
                        parentMenu.classList.add('show', 'open', 'active');

                        const parentItem = myLink.closest('.nav-item');
                        if (parentItem) {
                            parentItem.classList.add('open', 'active');
                            const mainToggle = parentItem.querySelector('.nav-link');
                            if (mainToggle) mainToggle.classList.add('active');
                        }
                    }
                }
            }, 100);
        };

        // المراقبة للزرار العائم
        function setupFloatingButtonObserver() {
            const mainSaveBtn = document.getElementById('mainSaveBtn');
            const floatingBtn = document.getElementById('floatingConfirmBtn');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) {
                        floatingBtn.classList.add('show');
                    } else {
                        floatingBtn.classList.remove('show');
                    }
                });
            }, { threshold: 0 });

            observer.observe(mainSaveBtn);
        }

        function saveDraft() {
            const draft = {
                supplierId: document.getElementById('supplierSelect').value,
                referenceNo: document.getElementById('referenceNo').value,
                warehouse: document.getElementById('warehouseSelect').value,
                orderDate: document.getElementById('orderDate').value,
                receiveDate: document.getElementById('receiveDate').value,
                notes: document.getElementById('termsNotes').value,
                discount: document.getElementById('discountInput').value,
                tax: document.getElementById('taxInput').value,
                paid: document.getElementById('paidInput').value,
                lines: orderLines
            };
            localStorage.setItem('pos_po_draft', JSON.stringify(draft));
        }

        function loadDraft() {
            const draftData = localStorage.getItem('pos_po_draft');
            if (draftData) {
                const draft = JSON.parse(draftData);
                document.getElementById('supplierSelect').value = draft.supplierId || '';
                document.getElementById('referenceNo').value = draft.referenceNo || '';
                document.getElementById('warehouseSelect').value = draft.warehouse || 'المخزن الرئيسي';
                document.getElementById('orderDate').value = draft.orderDate || getToday();
                document.getElementById('receiveDate').value = draft.receiveDate || getToday();
                document.getElementById('termsNotes').value = draft.notes || '';
                document.getElementById('discountInput').value = draft.discount || '';
                document.getElementById('taxInput').value = draft.tax || '';
                document.getElementById('paidInput').value = draft.paid || '';
                orderLines = draft.lines || [];

                checkSupplier();
                renderLines();
            } else {
                document.getElementById('orderDate').value = getToday();
                document.getElementById('receiveDate').value = getToday();
                renderLines();
            }
        }

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function checkSupplier() {
            const id = document.getElementById('supplierSelect').value;
            const div = document.getElementById('supplierBalanceDiv');
            const label = document.getElementById('supplierBalanceLabel');
            if (id) {
                const sup = contactsDB.find(c => c.id == id);
                if (sup && sup.balance < 0) {
                    label.innerText = Math.abs(sup.balance).toFixed(2) + " ج.م";
                    div.style.display = 'flex';
                } else { div.style.display = 'none'; }
            } else { div.style.display = 'none'; }
        }

        const searchInput = document.getElementById('productSearch');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.trim().toLowerCase();
            if (!term) { searchResults.style.display = 'none'; return; }
            const matches = productsDB.filter(p => p.name.toLowerCase().includes(term) || String(p.id).includes(term));

            if (matches.length > 0) {
                searchResults.innerHTML = matches.map(p => `
                    <div class="search-item" onclick="addLine('${p.id}')">
                        <span><strong>[${p.id}]</strong> ${p.name}</span>
                        <span style="color: var(--text-light); font-size: 0.9rem;">تكلفة: ${p.cost || 0} | بيع: ${p.price || 0}</span>
                    </div>
                `).join('');
                searchResults.style.display = 'block';
            } else { searchResults.style.display = 'none'; }
        });

        document.addEventListener('click', (e) => { if (!searchInput.contains(e.target)) searchResults.style.display = 'none'; });

        function addLine(id) {
            const product = productsDB.find(p => p.id == id);
            if (product) {
                const existing = orderLines.find(l => l.id == id);
                if (existing) {
                    let currentQty = parseFloat(existing.qty) || 0;
                    existing.qty = currentQty + 1;
                } else {
                    orderLines.push({
                        id: product.id,
                        name: product.name,
                        desc: product.name,
                        qty: '',
                        cost: product.cost ? parseFloat(product.cost) : '',
                        sellPrice: product.price ? parseFloat(product.price) : ''
                    });
                }
                renderLines();
                saveDraft();
            }
            searchInput.value = ''; searchInput.focus();
        }

        function removeLine(index) { orderLines.splice(index, 1); renderLines(); saveDraft(); }

        function renderLines() {
            const tbody = document.getElementById('poLinesBody');
            if (orderLines.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 3rem; color:var(--text-light); font-size: 1.1rem;"><i class="bi bi-cart-x" style="font-size: 2rem; display:block; margin-bottom: 10px;"></i> الفاتورة فارغة، ابحث لإضافة منتجات.</td></tr>';
            } else {
                tbody.innerHTML = orderLines.map((line, i) => {
                    const qtyVal = parseFloat(line.qty) || 0;
                    const costVal = parseFloat(line.cost) || 0;
                    const total = qtyVal * costVal;

                    return `
                        <tr>
                            <td style="font-weight: 800; color: var(--primary-dark);">${line.name}</td>
                            <td><input type="text" class="line-input dyn-input" data-index="${i}" data-field="desc" value="${line.desc}"></td>
                            <td><input type="number" class="line-input dyn-input text-left" data-index="${i}" data-field="qty" value="${line.qty !== '' ? line.qty : ''}" placeholder="الكمية" min="1"></td>
                            <td><input type="number" class="line-input dyn-input text-left" style="color:var(--danger);" data-index="${i}" data-field="cost" value="${line.cost !== '' ? line.cost : ''}" placeholder="السعر" min="0" step="0.5"></td>
                            <td><input type="number" class="line-input dyn-input text-left" style="color:var(--success);" data-index="${i}" data-field="sellPrice" value="${line.sellPrice !== '' ? line.sellPrice : ''}" placeholder="البيع" min="0" step="0.5"></td>
                            <td class="text-left" style="font-weight: 900; color: var(--primary);" id="rowTotal_${i}">${total.toFixed(2)}</td>
                            <td style="text-align:center;"><button class="btn btn-outline" style="padding: 4px 8px; color: var(--danger); border:none;" onclick="removeLine(${i})"><i class="bi bi-trash"></i></button></td>
                        </tr>
                    `;
                }).join('');
            }
            calcTotals();
        }

        document.getElementById('poLinesBody').addEventListener('input', function (e) {
            if (e.target.classList.contains('dyn-input')) {
                const index = parseInt(e.target.getAttribute('data-index'));
                const field = e.target.getAttribute('data-field');
                const value = e.target.value;

                if (field === 'desc') {
                    orderLines[index][field] = value;
                } else {
                    if (value === '') {
                        orderLines[index][field] = '';
                    } else {
                        let val = parseFloat(value);
                        if (val < 0) val = 0;
                        orderLines[index][field] = val;
                    }
                }

                const qtyVal = parseFloat(orderLines[index].qty) || 0;
                const costVal = parseFloat(orderLines[index].cost) || 0;
                const rowTotalElement = document.getElementById('rowTotal_' + index);
                if (rowTotalElement) {
                    rowTotalElement.innerText = (qtyVal * costVal).toFixed(2);
                }

                calcTotals();
                saveDraft();
            }
        });

        function calcTotals() {
            const subTotal = orderLines.reduce((sum, line) => {
                const qtyVal = parseFloat(line.qty) || 0;
                const costVal = parseFloat(line.cost) || 0;
                return sum + (qtyVal * costVal);
            }, 0);

            document.getElementById('subTotal').innerText = subTotal.toFixed(2);

            let discount = parseFloat(document.getElementById('discountInput').value) || 0;
            let taxes = parseFloat(document.getElementById('taxInput').value) || 0;
            let paidInputStr = document.getElementById('paidInput').value;
            let paid = parseFloat(paidInputStr) || 0;

            const grandTotal = (subTotal - discount) + taxes;
            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);

            if (paidInputStr !== '' && paid > grandTotal) {
                paid = grandTotal;
                document.getElementById('paidInput').value = paid;
            }

            if (paidInputStr === '') { paid = 0; }

            const due = grandTotal - paid;
            document.getElementById('dueAmount').innerText = due.toFixed(2);
        }

        function savePO() {
            const supId = document.getElementById('supplierSelect').value;
            const destination = document.getElementById('warehouseSelect').value;
            const paidStr = document.getElementById('paidInput').value;

            if (!supId) return Swal.fire('تنبيه', 'برجاء تحديد المورد أولاً', 'warning');
            if (orderLines.length === 0) return Swal.fire('تنبيه', 'الفاتورة فارغة!', 'warning');

            const hasEmptyQty = orderLines.some(l => l.qty === '' || parseFloat(l.qty) <= 0);
            if (hasEmptyQty) return Swal.fire('تنبيه', 'يوجد أصناف بدون كمية! برجاء كتابة الكمية المستلمة.', 'warning');

            if (paidStr === '') return Swal.fire('تنبيه', 'برجاء إدخال المبلغ المدفوع نقداً (اكتب 0 إذا كانت الفاتورة بالكامل آجلة)', 'warning');

            const grandTotal = parseFloat(document.getElementById('grandTotal').innerText);
            const paid = parseFloat(paidStr) || 0;
            const due = grandTotal - paid;

            let allProducts = JSON.parse(localStorage.getItem('pos_products')) || [];

            orderLines.forEach(line => {
                let pIndex = allProducts.findIndex(p => p.id == line.id);
                if (pIndex > -1) {
                    const qtyToAdd = parseFloat(line.qty) || 0;
                    if (destination === 'المعرض') {
                        allProducts[pIndex].stock_showroom = (parseFloat(allProducts[pIndex].stock_showroom) || 0) + qtyToAdd;
                    } else {
                        allProducts[pIndex].stock_main = (parseFloat(allProducts[pIndex].stock_main) || 0) + qtyToAdd;
                    }
                    if (line.cost !== '') allProducts[pIndex].cost = parseFloat(line.cost);
                    if (line.sellPrice !== '') allProducts[pIndex].price = parseFloat(line.sellPrice);
                }
            });
            localStorage.setItem('pos_products', JSON.stringify(allProducts));

            const newId = purchasesDB.length > 0 ? purchasesDB[purchasesDB.length - 1].id + 1 : 1;
            const poData = {
                id: newId, date: document.getElementById('orderDate').value,
                receiveDate: document.getElementById('receiveDate').value,
                reference: document.getElementById('referenceNo').value,
                supplierId: supId, warehouse: destination,
                notes: document.getElementById('termsNotes').value,
                items: [...orderLines],
                discount: parseFloat(document.getElementById('discountInput').value) || 0,
                taxes: parseFloat(document.getElementById('taxInput').value) || 0,
                total: grandTotal, paid: paid, debt: due
            };

            purchasesDB.push(poData);
            localStorage.setItem('pos_purchases', JSON.stringify(purchasesDB));

            if (due > 0) {
                const supIndex = contactsDB.findIndex(c => c.id == supId);
                if (supIndex > -1) {
                    contactsDB[supIndex].balance = (parseFloat(contactsDB[supIndex].balance) || 0) - due;
                    localStorage.setItem('pos_contacts', JSON.stringify(contactsDB));
                }
            }

            localStorage.removeItem('pos_po_draft');

            Swal.fire('تم الاعتماد!', `تم حفظ الفاتورة وتوجيه البضاعة لـ ${destination}`, 'success')
                .then(() => window.location.reload());
        }

        function clearForm() {
            Swal.fire({
                title: 'مسح البيانات؟', text: "هل أنت متأكد من مسح الفاتورة الحالية؟", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#6b7280',
                confirmButtonText: 'نعم، امسح', cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('pos_po_draft');
                    window.location.reload();
                }
            });
        }
    </script>
</body>

</html>
