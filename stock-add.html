<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إذن إضافة مخزنية - تك ستور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css?v=13.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --success: #10b981;
            --bg: #f3f4f6;
            --panel: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --danger: #ef4444;
            --warning: #f59e0b;
            --blue: #3b82f6;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: row;
        }

        .page-container {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }

        /* --- Header --- */
        .page-header {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px 25px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Cairo';
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* --- Cards & Forms --- */
        .card {
            background: var(--panel);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            border-top: 5px solid var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 700;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-control {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: 'Cairo';
            background: #f8fafc;
            color: var(--text);
            font-weight: bold;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: white;
        }

        /* --- Search & Table --- */
        .search-area {
            position: relative;
            margin-bottom: 20px;
        }

        #searchResults {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            z-index: 1000;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .search-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            font-weight: bold;
        }

        .search-item:hover {
            background: #f0fdf4;
            color: var(--primary);
            padding-right: 25px;
        }

        .table-scroll {
            overflow-x: auto;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #f1f5f9;
            color: var(--text-light);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--border);
            font-size: 0.95rem;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f8fafc;
            vertical-align: middle;
            font-weight: bold;
        }

        .qty-input {
            width: 100px;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-family: 'Cairo';
            font-weight: 900;
            font-size: 1.1rem;
            outline: none;
            transition: 0.2s;
        }

        .qty-main {
            color: var(--primary);
            background: #f0fdf4;
        }

        .qty-main:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .qty-showroom {
            color: var(--warning);
            background: #fffbeb;
        }

        .qty-showroom:focus {
            border-color: var(--warning);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.2);
        }

        /* =======================================================
           📱 الموبايل والتابلت (ريسبونسف ناعم ونظيف)
           ======================================================= */
        @media (max-width: 950px) {
            .page-container {
                padding: 80px 15px 20px 15px;
                /* عشان زرار المنيو العائم */
            }

            .page-header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .page-header div p {
                margin: 5px auto 0;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group[style] {
                grid-column: span 1 !important;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <div class="page-container">
        <div class="page-header">
            <div>
                <h1 class="page-title"><i class="bi bi-node-plus-fill" style="color: var(--primary);"></i> إذن إضافة
                    مخزنية متعددة</h1>
                <p style="color: var(--text-light); margin: 5px 0 0; font-weight: bold;">توزيع الكميات المضافة على
                    المخزن والمعرض في نفس الإذن.</p>
            </div>
            <button class="btn btn-primary" onclick="saveStockAdd()"><i class="bi bi-check2-circle"></i> اعتماد الإذن
                وتحديث الأرصدة</button>
        </div>

        <div class="card">
            <div class="form-grid">
                <div class="form-group">
                    <label>تاريخ الإذن:</label>
                    <input type="date" id="docDate" class="form-control">
                </div>
                <div class="form-group">
                    <label>سبب الإضافة (البيان): <span style="color:red">*</span></label>
                    <select id="reasonSelect" class="form-control">
                        <option value="رصيد أول المدة">رصيد أول المدة (بضاعة موجودة مسبقاً)</option>
                        <option value="تسوية جردية (زيادة)">تسوية جردية (زيادة تم اكتشافها)</option>
                        <option value="هدايا وعينات">هدايا وعينات مجانية</option>
                        <option value="أخرى">أخرى (يرجى التوضيح)</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>ملاحظات إضافية:</label>
                    <input type="text" id="notes" class="form-control" placeholder="أي تفاصيل أخرى توضح سبب الإضافة...">
                </div>
            </div>
        </div>

        <div class="card">
            <h3
                style="margin-top: 0; color: var(--text); border-bottom: 2px dashed var(--border); padding-bottom: 10px; margin-bottom: 15px;">
                📦 الأصناف المراد إضافتها وتوزيعها
            </h3>

            <div class="search-area">
                <input type="text" id="productSearch" class="form-control" placeholder="🔍 ابحث عن صنف لإضافته..."
                    autocomplete="off">
                <div id="searchResults"></div>
            </div>

            <div class="table-scroll">
                <table id="itemsTable">
                    <thead>
                        <tr>
                            <th width="15%" style="text-align: right;">الكود</th>
                            <th width="35%" style="text-align: right;">اسم الصنف</th>
                            <th width="20%"><span style="color: var(--primary);"><i class="bi bi-box-fill"></i> المخزن
                                    الرئيسي</span></th>
                            <th width="20%"><span style="color: var(--warning);"><i class="bi bi-shop"></i>
                                    المعرض</span></th>
                            <th width="10%">حذف</th>
                        </tr>
                    </thead>
                    <tbody id="documentItemsBody">
                        <tr id="emptyRow">
                            <td colspan="5"
                                style="text-align:center; color:var(--text-light); padding: 3rem; font-size: 1.1rem;">
                                <i class="bi bi-box-seam"
                                    style="font-size: 2.5rem; display: block; margin-bottom: 10px;"></i>
                                ابحث عن منتج وأضفه لتوزيع كمياته.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="navbar.js?v=13.0"></script>
    <script>
        const securityCheck = JSON.parse(localStorage.getItem('pos_current_user'));
        if (!securityCheck || (securityCheck.role !== 'admin' && securityCheck.role !== 'أدمن')) {
            window.location.replace("index.html");
        }

        let productsDB = JSON.parse(localStorage.getItem('pos_products')) || [];
        let stockDocsDB = JSON.parse(localStorage.getItem('pos_stock_docs')) || [];
        let docItems = [];

        window.onload = function () {
            document.getElementById('docDate').value = new Date().toISOString().split('T')[0];

            // رادار الناف بار
            const checkNavbar = setInterval(() => {
                const myLink = document.querySelector('a[href*="stock-add.html"]');
                if (myLink) {
                    clearInterval(checkNavbar);
                    myLink.classList.add('active');
                    const parentMenu = myLink.closest('.dropdown-menu') || myLink.closest('ul');
                    if (parentMenu) {
                        parentMenu.style.display = 'flex';
                        parentMenu.style.flexDirection = 'column';
                        parentMenu.style.visibility = 'visible';
                        parentMenu.style.opacity = '1';
                        parentMenu.classList.add('show', 'open', 'active');
                        const parentItem = myLink.closest('.nav-item');
                        if (parentItem) {
                            parentItem.classList.add('open', 'active');
                            const mainToggle = parentItem.querySelector('.nav-link');
                            if (mainToggle) mainToggle.classList.add('active');
                        }
                    }
                }
            }, 100);
        };

        const searchInput = document.getElementById('productSearch');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.trim().toLowerCase();
            if (!term) { searchResults.style.display = 'none'; return; }
            const matches = productsDB.filter(p => p.name.toLowerCase().includes(term) || String(p.id).includes(term));
            if (matches.length > 0) {
                searchResults.innerHTML = matches.map(p => `
                    <div class="search-item" onclick="addItem('${p.id}')">
                        <span><strong style="color:var(--primary)">[${p.id}]</strong> ${p.name}</span>
                        <span style="color: var(--primary); font-size: 1.2rem;"><i class="bi bi-plus-circle-fill"></i></span>
                    </div>
                `).join('');
                searchResults.style.display = 'block';
            } else { searchResults.style.display = 'none'; }
        });

        document.addEventListener('click', (e) => { if (!searchInput.contains(e.target)) searchResults.style.display = 'none'; });

        function addItem(code) {
            const product = productsDB.find(p => String(p.id) === String(code));
            if (product) {
                const existing = docItems.find(i => String(i.code) === String(code));
                if (!existing) docItems.push({ code: product.id, name: product.name, qty_main: 1, qty_showroom: 0 });
                else Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: 'الصنف موجود', showConfirmButton: false, timer: 1500 });
                renderTable();
            }
            searchInput.value = ''; searchResults.style.display = 'none';
        }

        function updateQty(index, type, value) {
            let val = parseInt(value);
            if (isNaN(val) || val < 0) val = 0;
            docItems[index][type] = val;
        }

        function removeItem(index) { docItems.splice(index, 1); renderTable(); }

        function renderTable() {
            const tbody = document.getElementById('documentItemsBody');
            if (docItems.length === 0) {
                tbody.innerHTML = `<tr id="emptyRow"><td colspan="5" style="text-align:center; color:var(--text-light); padding: 3rem; font-size: 1.1rem;"><i class="bi bi-box-seam" style="font-size: 2.5rem; display: block; margin-bottom: 10px;"></i> ابحث عن منتج وأضفه لتوزيع كمياته.</td></tr>`;
            } else {
                tbody.innerHTML = docItems.map((item, index) => `
                    <tr>
                        <td style="color: var(--text-light); font-weight: 900; text-align: right;">${item.code}</td>
                        <td style="font-size: 1.1rem; color: var(--primary-dark); text-align: right;">${item.name}</td>
                        <td style="text-align: center;"><input type="number" class="qty-input qty-main" value="${item.qty_main}" min="0" oninput="updateQty(${index}, 'qty_main', this.value)"></td>
                        <td style="text-align: center;"><input type="number" class="qty-input qty-showroom" value="${item.qty_showroom}" min="0" oninput="updateQty(${index}, 'qty_showroom', this.value)"></td>
                        <td style="text-align: center;"><button class="action-btn" onclick="removeItem(${index})"><i class="bi bi-trash3-fill"></i></button></td>
                    </tr>
                `).join('');
            }
        }

        function saveStockAdd() {
            if (docItems.length === 0) return Swal.fire('تنبيه', 'الرجاء إضافة أصناف', 'warning');
            let totalAddedQty = docItems.reduce((sum, item) => sum + item.qty_main + item.qty_showroom, 0);
            if (totalAddedQty === 0) return Swal.fire('تنبيه', 'جميع الكميات صفر!', 'error');

            const date = document.getElementById('docDate').value;
            const reason = document.getElementById('reasonSelect').value;
            const notes = document.getElementById('notes').value.trim();

            Swal.fire({
                title: 'تأكيد الإضافة', text: `تأكيد إضافة الكميات للمخزن والمعرض؟`, icon: 'question',
                showCancelButton: true, confirmButtonColor: '#10b981', cancelButtonColor: '#64748b',
                confirmButtonText: 'نعم، اعتمد', cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    docItems.forEach(item => {
                        let pIndex = productsDB.findIndex(p => String(p.id) === String(item.code));
                        if (pIndex > -1) {
                            productsDB[pIndex].stock_main = (parseFloat(productsDB[pIndex].stock_main) || 0) + item.qty_main;
                            productsDB[pIndex].stock_showroom = (parseFloat(productsDB[pIndex].stock_showroom) || 0) + item.qty_showroom;
                        }
                    });

                    localStorage.setItem('pos_products', JSON.stringify(productsDB));

                    const newId = stockDocsDB.length > 0 ? stockDocsDB[stockDocsDB.length - 1].id + 1 : 1;
                    stockDocsDB.push({ id: newId, type: 'إضافة (مزدوجة)', date: new Date(date).toLocaleString('ar-EG'), warehouse: 'متعدد', reason: reason, notes: notes, items: [...docItems], user: securityCheck.name || 'أدمن' });
                    localStorage.setItem('pos_stock_docs', JSON.stringify(stockDocsDB));

                    Swal.fire('تم بنجاح!', `تم اعتماد الإذن #${newId}`, 'success').then(() => window.location.reload());
                }
            });
        }
    </script>
</body>

</html>
