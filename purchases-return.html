<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرتجع المبيعات - تك ستور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="navbar.css?v=13.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --success: #10b981;
            --bg: #f3f4f6;
            --panel: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
            width: 100%;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: row;
        }

        .page-container {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2rem;
            position: relative;
        }

        .page-header {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px 25px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            align-items: center;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-search {
            background: var(--text);
            color: white;
            height: 48px;
        }

        .btn-search:hover { background: #000; }
        .btn-return { background: #fee2e2; color: var(--danger); font-size: 0.9rem; padding: 8px 15px; }
        .btn-return:hover { background: var(--danger); color: white; }
        .btn-disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; padding: 8px 15px; font-size: 0.95rem; border: 1px solid var(--border); }

        .erp-document {
            background: var(--panel);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .invoice-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px dashed var(--border);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            background: #f8fafc;
            padding: 12px;
            text-align: center;
            border-bottom: 2px solid var(--border);
            color: var(--text-light);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-weight: 600;
        }

        tr:hover td { background-color: #f8fafc; }

        /* =======================================================
           📱 الميديا كويري (Responsive) القاضية
           ======================================================= */
        @media (max-width: 950px) {
            html, body {
                overflow-x: hidden !important; 
                overflow-y: auto !important; 
            }

            .page-container {
                padding: 80px 15px 20px 15px !important; 
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px;
            }

            /* 💡 إجبار مربع البحث والزرار تحت بعض بكامل العرض */
            .search-box {
                display: flex !important;
                flex-direction: column !important; 
                align-items: stretch !important; 
                padding: 15px !important;
                gap: 12px !important;
            }

            .search-box input {
                width: 100% !important;
                max-width: 100% !important;
                flex: none !important;
            }

            .search-box .btn-search {
                width: 100% !important;
                max-width: 100% !important;
                justify-content: center !important;
                margin: 0 !important;
            }

            /* 💡 إجبار الجداول على السكرول العرضي جوا البوكس بتاعها */
            .erp-document {
                padding: 15px !important;
                width: 100% !important;
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch !important;
            }

            table {
                min-width: 750px !important; 
            }

            .invoice-info-grid {
                grid-template-columns: 1fr !important; 
                gap: 10px !important;
            }
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>

    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title">
                <i class="bi bi-arrow-return-left" style="color: var(--danger);"></i>
                مرتجع المبيعات
            </h1>
        </div>

        <div class="search-box">
            <input type="number" id="searchId" placeholder="🔍 أدخل رقم فاتورة المبيعات للبحث..."
                onkeypress="if(event.key === 'Enter') searchInvoice()">
            <button class="btn btn-search" onclick="searchInvoice()"><i class="bi bi-search"></i> بحث في الفواتير</button>
        </div>

        <div id="invoiceCard" class="erp-document" style="display:none;">
            <div class="invoice-info-grid">
                <div>رقم الفاتورة: <b id="invIdDisplay" style="color: var(--primary); font-size: 1.1rem;">#0</b></div>
                <div>العميل: <b id="customerNameDisplay" style="color: var(--text);">--</b></div>
                <div>التاريخ: <span id="invDateDisplay" style="color: var(--text-light);">--</span></div>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="text-align: right;">الصنف</th>
                            <th>سعر البيع</th>
                            <th>الكمية المباعة</th>
                            <th>تم إرجاعه</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceItemsBody"></tbody>
                </table>
            </div>
        </div>

        <div class="erp-document">
            <h3 style="margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px dashed var(--border); padding-bottom: 10px; color: var(--text);">
                📋 سجل مرتجعات المبيعات السابقة
            </h3>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>رقم المرتجع</th>
                            <th>التاريخ</th>
                            <th>العميل</th>
                            <th style="text-align: right;">المنتجات المستردة</th>
                            <th>قيمة الاسترداد</th>
                        </tr>
                    </thead>
                    <tbody id="returnsLogBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="navbar.js?v=13.0"></script>
    <script>
        // 🛡️ كود الحماية (متاح للكاشير والأدمن)
        const securityCheck = JSON.parse(localStorage.getItem('pos_current_user'));
        if (!securityCheck) {
            window.location.replace("login.html");
        }

        let historyDB = JSON.parse(localStorage.getItem('pos_history')) || [];
        let salesReturnsDB = JSON.parse(localStorage.getItem('pos_sales_returns')) || [];
        let contactsDB = JSON.parse(localStorage.getItem('pos_contacts')) || [];
        let productsDB = JSON.parse(localStorage.getItem('pos_products')) || [];
        let currentInv = null;

        window.onload = function () {
            renderLog();

            // 💡 رادار الناف بار عشان الأكورديون يفضل مفتوح على المبيعات
            const checkNavbar = setInterval(() => {
                const myLink = document.querySelector('a[href*="sales-return.html"]');
                if (myLink) {
                    clearInterval(checkNavbar);
                    myLink.classList.add('active');
                    const parentMenu = myLink.closest('.dropdown-menu') || myLink.closest('ul');
                    if (parentMenu) {
                        parentMenu.style.display = 'flex';
                        parentMenu.style.flexDirection = 'column';
                        parentMenu.style.visibility = 'visible';
                        parentMenu.style.opacity = '1';
                        parentMenu.classList.add('show', 'open', 'active');
                        const parentItem = myLink.closest('.nav-item');
                        if (parentItem) {
                            parentItem.classList.add('open', 'active');
                            const mainToggle = parentItem.querySelector('.nav-link');
                            if (mainToggle) mainToggle.classList.add('active');
                        }
                    }
                }
            }, 100);
        };

        function searchInvoice() {
            const id = parseInt(document.getElementById('searchId').value);
            if (!id) return;

            // تحديث الداتا
            historyDB = JSON.parse(localStorage.getItem('pos_history')) || [];
            contactsDB = JSON.parse(localStorage.getItem('pos_contacts')) || [];
            productsDB = JSON.parse(localStorage.getItem('pos_products')) || [];

            currentInv = historyDB.find(inv => inv.id === id);

            if (!currentInv) {
                Swal.fire('خطأ', 'لم يتم العثور على فاتورة مبيعات بهذا الرقم', 'error');
                document.getElementById('invoiceCard').style.display = 'none';
                return;
            }

            document.getElementById('invIdDisplay').innerText = "INV-" + String(currentInv.id).padStart(4, '0');
            document.getElementById('customerNameDisplay').innerText = currentInv.customer || "عميل طياري";
            document.getElementById('invDateDisplay').innerText = currentInv.date;

            renderInvoiceItems();
            document.getElementById('invoiceCard').style.display = 'block';
        }

        function renderInvoiceItems() {
            const itemsBody = document.getElementById('invoiceItemsBody');
            itemsBody.innerHTML = currentInv.items.map((item, idx) => {
                const returnedQty = item.returnedQty || 0;
                const availableToReturn = item.qty - returnedQty;

                let actionBtn = '';
                // لو كان الصنف صيانة حرة مفيش ليه إرجاع مخزني
                if(item.isRepair) {
                    actionBtn = `<span style="color: #94a3b8; font-weight: bold;">خدمة صيانة</span>`;
                } else if (availableToReturn > 0) {
                    actionBtn = `<button class="btn btn-return" onclick="processReturn(${idx})"><i class="bi bi-arrow-return-right"></i> استرجاع</button>`;
                } else {
                    actionBtn = `<span style="color: var(--success); font-weight: bold;"><i class="bi bi-check2-all"></i> تم الإرجاع بالكامل</span>`;
                }

                return `
                <tr>
                    <td style="text-align: right; font-weight: 800; color: var(--primary-dark);">${item.name}</td>
                    <td>${(parseFloat(item.price) || 0).toFixed(2)} ج.م</td>
                    <td style="font-size: 1.1rem;">${item.qty}</td>
                    <td style="color: var(--danger); font-size: 1.1rem; font-weight: 900;">${returnedQty}</td>
                    <td style="display: flex; justify-content: center;">${actionBtn}</td>
                </tr>
                `;
            }).join('');
        }

        function processReturn(idx) {
            const item = currentInv.items[idx];
            const maxReturn = item.qty - (item.returnedQty || 0);

            Swal.fire({
                title: `استرجاع: ${item.name}`,
                html: `
                    <div style="text-align: right; font-size: 0.95rem; margin-bottom: 10px;">
                        <p>🔄 المتبقي من الفاتورة للاسترجاع: <b style="color:var(--primary);">${maxReturn}</b></p>
                    </div>
                `,
                input: 'number',
                inputAttributes: { min: 1, max: maxReturn, step: 1 },
                inputValue: 1,
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'تأكيد الاسترجاع',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    const qtyToReturn = parseInt(result.value);
                    if (isNaN(qtyToReturn) || qtyToReturn <= 0 || qtyToReturn > maxReturn) {
                        return Swal.fire('خطأ', 'الكمية المدخلة غير صحيحة!', 'error');
                    }

                    const refundVal = qtyToReturn * (parseFloat(item.price) || 0);

                    // أ. تحديث الفاتورة الأصلية (سجل المبيعات)
                    item.returnedQty = (item.returnedQty || 0) + qtyToReturn;
                    const invIndex = historyDB.findIndex(inv => inv.id === currentInv.id);
                    historyDB[invIndex] = currentInv;
                    localStorage.setItem('pos_history', JSON.stringify(historyDB));

                    // ب. إرجاع الكمية إلى رصيد المعرض
                    const productIndex = productsDB.findIndex(p => p.id == (item.code || item.id));
                    if (productIndex > -1) {
                        productsDB[productIndex].stock_showroom = (parseFloat(productsDB[productIndex].stock_showroom) || 0) + qtyToReturn;
                        localStorage.setItem('pos_products', JSON.stringify(productsDB));
                    }

                    // ج. تسجيل عملية المرتجع في السجل
                    const returnEntry = {
                        id: salesReturnsDB.length + 1,
                        invoiceId: currentInv.id,
                        date: new Date().toLocaleString('ar-EG'),
                        customerName: currentInv.customer || "عميل طياري",
                        items: `${item.name} (x${qtyToReturn})`,
                        amount: refundVal
                    };
                    salesReturnsDB.push(returnEntry);
                    localStorage.setItem('pos_sales_returns', JSON.stringify(salesReturnsDB));

                    // د. تحديث رصيد العميل (لو الفاتورة مسجلة باسم عميل وعليه مديونية)
                    if (currentInv.customer) {
                        let customer = contactsDB.find(c => c.name === currentInv.customer && c.type === 'عميل');
                        if (customer) {
                            // رصيد العميل بالموجب معناه ديون عليه، الاسترجاع بيقلل ديونه
                            customer.balance = (parseFloat(customer.balance) || 0) - refundVal;
                            localStorage.setItem('pos_contacts', JSON.stringify(contactsDB));
                        }
                    }

                    Swal.fire('نجاح', `تم استرجاع البضاعة وإضافتها للمعرض ورد قيمة ${refundVal.toFixed(2)} ج.م`, 'success');
                    renderInvoiceItems();
                    renderLog();
                }
            });
        }

        function renderLog() {
            const logBody = document.getElementById('returnsLogBody');
            salesReturnsDB = JSON.parse(localStorage.getItem('pos_sales_returns')) || [];

            if (salesReturnsDB.length === 0) {
                logBody.innerHTML = '<tr><td colspan="5" style="color: var(--text-light); padding: 20px; text-align: center;">لا توجد مرتجعات مسجلة</td></tr>';
                return;
            }

            logBody.innerHTML = [...salesReturnsDB].reverse().map(ret => `
                <tr>
                    <td style="font-weight: bold; color: var(--danger);">RET-${String(ret.id).padStart(4, '0')}</td>
                    <td style="font-size: 0.85rem; color: var(--text-light);">${ret.date}</td>
                    <td style="font-weight: 700;">${ret.customerName}</td>
                    <td style="text-align: right; font-size: 0.9rem;">${ret.items} <br><small style="color: var(--primary);">فاتورة: INV-${String(ret.invoiceId).padStart(4, '0')}</small></td>
                    <td style="color: var(--warning); font-weight: 900;">${(ret.amount || 0).toFixed(2)} ج.م</td>
                </tr>
            `).join('');
        }
    </script>
</body>

</html>
