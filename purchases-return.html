<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرتجع المشتريات - تك ستور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="navbar.css?v=6.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --success: #10b981;
            --bg: #f3f4f6;
            --panel: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: row;
        }

        .page-container {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }

        .page-header {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px 25px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-search {
            background: var(--text);
            color: white;
        }

        .btn-search:hover {
            background: #000;
        }

        .btn-return {
            background: #fee2e2;
            color: var(--danger);
            font-size: 0.9rem;
            padding: 8px 15px;
        }

        .btn-return:hover {
            background: var(--danger);
            color: white;
        }

        .erp-document {
            background: var(--panel);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .invoice-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px dashed var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            padding: 12px;
            text-align: center;
            border-bottom: 2px solid var(--border);
            color: var(--text-light);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>

    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title">
                <i class="bi bi-arrow-return-left" style="color: var(--warning);"></i>
                مرتجع المشتريات
            </h1>
        </div>

        <!-- صندوق البحث -->
        <div class="search-box">
            <input type="number" id="searchId" placeholder="🔍 أدخل رقم فاتورة الشراء للبحث..."
                onkeypress="if(event.key === 'Enter') searchInvoice()">
            <button class="btn btn-search" onclick="searchInvoice()"><i class="bi bi-search"></i> بحث في
                الفواتير</button>
        </div>

        <!-- تفاصيل الفاتورة -->
        <div id="invoiceCard" class="erp-document" style="display:none;">
            <div class="invoice-info-grid">
                <div>رقم الفاتورة: <b id="invIdDisplay" style="color: var(--primary); font-size: 1.1rem;">#0</b></div>
                <div>المورد: <b id="supplierNameDisplay" style="color: var(--text);">--</b></div>
                <div>وجهة الاستلام: <b id="warehouseDisplay" style="color: var(--info);">--</b></div>
                <div>التاريخ: <span id="invDateDisplay" style="color: var(--text-light);">--</span></div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="text-align: right;">الصنف</th>
                        <th>سعر الشراء</th>
                        <th>الكمية المستلمة</th>
                        <th>تم إرجاعه</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="invoiceItemsBody"></tbody>
            </table>
        </div>

        <!-- سجل المرتجعات -->
        <div class="erp-document">
            <h3
                style="margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px dashed var(--border); padding-bottom: 10px;">
                📋 سجل المرتجعات السابقة</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>رقم المرتجع</th>
                            <th>التاريخ</th>
                            <th>المورد</th>
                            <th style="text-align: right;">المنتجات</th>
                            <th>القيمة المستردة</th>
                        </tr>
                    </thead>
                    <tbody id="returnsLogBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="navbar.js?v=6.0"></script>
    <script>
        let purchasesDB = JSON.parse(localStorage.getItem('pos_purchases')) || [];
        let purchaseReturnsDB = JSON.parse(localStorage.getItem('pos_purchases_returns')) || [];
        let contactsDB = JSON.parse(localStorage.getItem('pos_contacts')) || [];
        let productsDB = JSON.parse(localStorage.getItem('pos_products')) || [];
        let currentInv = null;

        function searchInvoice() {
            const id = parseInt(document.getElementById('searchId').value);
            if (!id) return;

            // تحديث الداتا عشان لو في تعديلات حصلت في صفحات تانية
            purchasesDB = JSON.parse(localStorage.getItem('pos_purchases')) || [];
            contactsDB = JSON.parse(localStorage.getItem('pos_contacts')) || [];
            productsDB = JSON.parse(localStorage.getItem('pos_products')) || [];

            currentInv = purchasesDB.find(inv => inv.id === id);

            if (!currentInv) {
                Swal.fire('خطأ', 'لم يتم العثور على فاتورة مشتريات بهذا الرقم', 'error');
                document.getElementById('invoiceCard').style.display = 'none';
                return;
            }

            const supplier = contactsDB.find(c => c.id == currentInv.supplierId);
            document.getElementById('invIdDisplay').innerText = "PO-" + String(currentInv.id).padStart(4, '0');
            document.getElementById('supplierNameDisplay').innerText = supplier ? supplier.name : "مورد عام";
            document.getElementById('invDateDisplay').innerText = currentInv.date;
            document.getElementById('warehouseDisplay').innerText = currentInv.warehouse || "المخزن الرئيسي";

            renderInvoiceItems();
            document.getElementById('invoiceCard').style.display = 'block';
        }

        function renderInvoiceItems() {
            const itemsBody = document.getElementById('invoiceItemsBody');
            itemsBody.innerHTML = currentInv.items.map((item, idx) => {
                const returnedQty = item.returnedQty || 0;
                const availableToReturn = item.qty - returnedQty;

                let actionBtn = '';
                if (availableToReturn > 0) {
                    actionBtn = `<button class="btn btn-return" onclick="processReturn(${idx})"><i class="bi bi-box-arrow-up-right"></i> إرجاع</button>`;
                } else {
                    actionBtn = `<span style="color: var(--success); font-weight: bold;"><i class="bi bi-check2-all"></i> تم الإرجاع بالكامل</span>`;
                }

                return `
                <tr>
                    <td style="text-align: right; font-weight: 800; color: var(--primary-dark);">${item.name}</td>
                    <td>${(parseFloat(item.cost) || 0).toFixed(2)} ج.م</td>
                    <td style="font-size: 1.1rem;">${item.qty}</td>
                    <td style="color: var(--danger); font-size: 1.1rem; font-weight: 900;">${returnedQty}</td>
                    <td style="display: flex; justify-content: center;">${actionBtn}</td>
                </tr>
                `;
            }).join('');
        }

        function processReturn(idx) {
            const item = currentInv.items[idx];
            const maxReturn = item.qty - (item.returnedQty || 0);
            const targetWarehouse = currentInv.warehouse || "المخزن الرئيسي";

            // 1. التحقق من الرصيد الفعلي في المخزن قبل الإرجاع
            let currentStock = 0;
            const productIndex = productsDB.findIndex(p => p.id == item.id);
            if (productIndex > -1) {
                if (targetWarehouse === 'المعرض') {
                    currentStock = parseFloat(productsDB[productIndex].stock_showroom) || 0;
                } else {
                    currentStock = parseFloat(productsDB[productIndex].stock_main) || 0;
                }
            }

            if (currentStock <= 0) {
                return Swal.fire('خطأ في الرصيد', `لا يمكن إرجاع الصنف لأن رصيده الحالي في (${targetWarehouse}) يساوي صفر (تم بيعه أو نقله).`, 'error');
            }

            const allowedToReturn = Math.min(maxReturn, currentStock);

            Swal.fire({
                title: `إرجاع: ${item.name}`,
                html: `
                    <div style="text-align: right; font-size: 0.95rem; margin-bottom: 10px;">
                        <p>📦 الرصيد المتوفر للخصم من ${targetWarehouse}: <b style="color:var(--danger);">${currentStock}</b></p>
                        <p>🔄 المتبقي من الفاتورة: <b style="color:var(--primary);">${maxReturn}</b></p>
                    </div>
                `,
                input: 'number',
                inputAttributes: { min: 1, max: allowedToReturn, step: 1 },
                inputValue: 1,
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'تأكيد الإرجاع',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    const qtyToReturn = parseInt(result.value);
                    if (isNaN(qtyToReturn) || qtyToReturn <= 0 || qtyToReturn > allowedToReturn) {
                        return Swal.fire('خطأ', 'الكمية المدخلة غير صحيحة أو تتجاوز الرصيد المتاح!', 'error');
                    }

                    const refundVal = qtyToReturn * (parseFloat(item.cost) || 0);

                    // أ. تحديث الفاتورة الأصلية
                    item.returnedQty = (item.returnedQty || 0) + qtyToReturn;
                    const invIndex = purchasesDB.findIndex(inv => inv.id === currentInv.id);
                    purchasesDB[invIndex] = currentInv;
                    localStorage.setItem('pos_purchases', JSON.stringify(purchasesDB));

                    // ب. خصم الكمية من المخزون الصحيح (اللوجيك الجديد)
                    if (productIndex > -1) {
                        if (targetWarehouse === 'المعرض') {
                            productsDB[productIndex].stock_showroom -= qtyToReturn;
                        } else {
                            productsDB[productIndex].stock_main -= qtyToReturn;
                        }
                        localStorage.setItem('pos_products', JSON.stringify(productsDB));
                    }

                    // ج. تسجيل عملية المرتجع في السجل
                    const supplier = contactsDB.find(c => c.id == currentInv.supplierId);
                    const returnEntry = {
                        id: purchaseReturnsDB.length + 1,
                        invoiceId: currentInv.id,
                        date: new Date().toLocaleString('ar-EG'),
                        supplierName: supplier ? supplier.name : "مورد عام",
                        items: `${item.name} (x${qtyToReturn})`,
                        amount: refundVal
                    };
                    purchaseReturnsDB.push(returnEntry);
                    localStorage.setItem('pos_purchases_returns', JSON.stringify(purchaseReturnsDB));

                    // د. تحديث رصيد المورد (تقليل المديونية)
                    // المورد حسابه بالسالب (ديون علينا)، لما نرجعله بضاعة هنزود رصيده بالموجب (الديون تقل)
                    if (supplier) {
                        supplier.balance = (parseFloat(supplier.balance) || 0) + refundVal;
                        localStorage.setItem('pos_contacts', JSON.stringify(contactsDB));
                    }

                    Swal.fire('نجاح', `تم خصم البضاعة من (${targetWarehouse}) وتقليل المديونية بقيمة ${refundVal} ج.م`, 'success');
                    renderInvoiceItems();
                    renderLog();
                }
            });
        }

        function renderLog() {
            const logBody = document.getElementById('returnsLogBody');
            purchaseReturnsDB = JSON.parse(localStorage.getItem('pos_purchases_returns')) || [];

            if (purchaseReturnsDB.length === 0) {
                logBody.innerHTML = '<tr><td colspan="5" style="color: var(--text-light); padding: 20px;">لا توجد مرتجعات مسجلة</td></tr>';
                return;
            }

            logBody.innerHTML = [...purchaseReturnsDB].reverse().map(ret => `
                <tr>
                    <td style="font-weight: bold; color: var(--warning);">RET-${String(ret.id).padStart(4, '0')}</td>
                    <td style="font-size: 0.85rem; color: var(--text-light);">${ret.date}</td>
                    <td style="font-weight: 700;">${ret.supplierName}</td>
                    <td style="text-align: right; font-size: 0.9rem;">${ret.items} <br><small style="color: var(--primary);">فاتورة: PO-${String(ret.invoiceId).padStart(4, '0')}</small></td>
                    <td style="color: var(--danger); font-weight: 900;">-${(ret.amount || 0).toFixed(2)} ج.م</td>
                </tr>
            `).join('');
        }

        window.onload = renderLog;
    </script>
</body>

</html>
