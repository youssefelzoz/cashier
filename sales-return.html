<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرتجع المشتريات - تك ستور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="navbar.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #10b981;
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #1e293b;
            --danger: #ef4444;
            --warning: #f59e0b;
            --blue: #3b82f6;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* 1. هيكلة السايد بار مع المحتوى */
        html,
        body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: row;
        }

        /* 2. حاوية المحتوى الأساسية */
        .page-container {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border);
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
            border: 1px solid var(--border);
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--warning);
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-search {
            background: #1e293b;
            color: white;
        }

        .btn-search:hover {
            background: #334155;
        }

        .btn-return {
            background: #fef3c7;
            color: #d97706;
            padding: 6px 15px;
            font-size: 0.9rem;
        }

        .btn-return:hover {
            background: #d97706;
            color: white;
        }

        .btn-disabled {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            padding: 6px 15px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }

        .invoice-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            display: none;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #f8fafc;
            color: #64748b;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
            font-weight: 600;
            text-align: center;
        }

        .returns-log-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <!-- 💡 تم تغيير الـ ID ليتناسب مع navbar.js -->
    <div id="navbar-container"></div>

    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title">📤 مرتجع المشتريات</h1>
        </div>

        <div class="search-box">
            <input type="number" id="searchId" placeholder="أدخل رقم فاتورة الشراء..."
                onkeypress="if(event.key === 'Enter') searchInvoice()">
            <button class="btn btn-search" onclick="searchInvoice()"><i class="bi bi-search"></i> بحث</button>
        </div>

        <div id="invoiceCard" class="invoice-card">
            <div
                style="display: flex; justify-content: space-between; border-bottom: 2px dashed #e2e8f0; padding-bottom: 10px; margin-bottom: 15px;">
                <div>
                    <h3 style="margin: 0; color: #1e293b;">فاتورة شراء رقم: <span id="invIdDisplay"
                            style="color: var(--warning);">#0</span></h3>
                    <div style="color: #64748b; margin-top: 5px; font-size: 0.9rem;">المورد: <strong
                            id="supplierNameDisplay" style="color: var(--blue);">--</strong></div>
                </div>
                <div style="text-align: left;">
                    <div id="invDateDisplay" style="color: #64748b; font-size: 0.9rem;"></div>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="text-align: right;">الصنف</th>
                        <th>تكلفة الشراء</th>
                        <th>الكمية الأصلية</th>
                        <th>تم إرجاعه</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="invoiceItems"></tbody>
            </table>
        </div>

        <div class="returns-log-section">
            <h3
                style="margin-top: 0; color: #1e293b; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px;">
                📋 سجل مرتجعات المشتريات السابقة</h3>
            <table>
                <thead>
                    <tr>
                        <th>رقم المرتجع</th>
                        <th>التاريخ</th>
                        <th>المورد</th>
                        <th>المنتجات</th>
                        <th>قيمة الاسترداد</th>
                    </tr>
                </thead>
                <tbody id="returnsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script>
        let purchasesDB = JSON.parse(localStorage.getItem('pos_purchases')) || [];
        let purchaseReturnsDB = JSON.parse(localStorage.getItem('pos_purchases_returns')) || [];
        let contactsDB = JSON.parse(localStorage.getItem('pos_contacts')) || [];
        let currentInvoice = null;

        window.onload = function () {
            renderReturnsLog();
        };

        function searchInvoice() {
            const idToSearch = parseInt(document.getElementById('searchId').value);
            currentInvoice = purchasesDB.find(inv => inv.id === idToSearch);

            if (!currentInvoice) {
                document.getElementById('invoiceCard').style.display = 'none';
                Swal.fire('خطأ', 'لم يتم العثور على فاتورة مشتريات بهذا الرقم!', 'error');
                return;
            }

            const supplier = contactsDB.find(c => c.id == currentInvoice.supplierId);
            const supplierName = supplier ? supplier.name : 'مورد غير معروف';

            document.getElementById('invIdDisplay').innerText = "#" + currentInvoice.id;
            document.getElementById('supplierNameDisplay').innerText = supplierName;
            document.getElementById('invDateDisplay').innerText = currentInvoice.date;

            const itemsBody = document.getElementById('invoiceItems');
            itemsBody.innerHTML = currentInvoice.items.map((item, index) => {
                const returnedAlready = item.returnedQty || 0;
                const remainingQty = item.qty - returnedAlready;

                const actionBtn = remainingQty > 0
                    ? `<button class="btn btn-return" onclick="processReturn(${index})">إرجاع ↩️</button>`
                    : `<button class="btn-disabled" disabled>تم الإرجاع ✔️</button>`;

                return `
                    <tr>
                        <td style="text-align: right;">${item.name}</td>
                        <td>${item.cost.toFixed(2)} ج.م</td>
                        <td>${item.qty}</td>
                        <td style="color: var(--danger); font-weight: bold;">${returnedAlready}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
            }).join('');

            document.getElementById('invoiceCard').style.display = 'block';
        }

        function processReturn(itemIndex) {
            const item = currentInvoice.items[itemIndex];
            const remainingQty = item.qty - (item.returnedQty || 0);

            Swal.fire({
                title: `إرجاع للمورد (${item.name})`,
                text: `الكمية المتاحة للإرجاع: ${remainingQty}`,
                input: 'number',
                inputAttributes: { min: 1, max: remainingQty, step: 1 },
                inputValue: 1,
                showCancelButton: true,
                confirmButtonText: 'تأكيد الإرجاع',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    const returnQty = parseInt(result.value);
                    if (isNaN(returnQty) || returnQty <= 0 || returnQty > remainingQty) {
                        Swal.fire('خطأ', 'الكمية غير صحيحة', 'error');
                        return;
                    }

                    const refundAmount = returnQty * item.cost;
                    item.returnedQty = (item.returnedQty || 0) + returnQty;
                    localStorage.setItem('pos_purchases', JSON.stringify(purchasesDB));

                    const supplier = contactsDB.find(c => c.id == currentInvoice.supplierId);
                    if (supplier) {
                        supplier.balance = (parseFloat(supplier.balance) || 0) + refundAmount;
                        localStorage.setItem('pos_contacts', JSON.stringify(contactsDB));
                    }

                    const newReturnId = purchaseReturnsDB.length > 0 ? purchaseReturnsDB[purchaseReturnsDB.length - 1].id + 1 : 1;
                    purchaseReturnsDB.push({
                        id: newReturnId,
                        date: new Date().toLocaleString('ar-EG'),
                        originalInvoiceId: currentInvoice.id,
                        supplierName: supplier ? supplier.name : 'غير معروف',
                        refundTotal: refundAmount,
                        itemsReturned: `${item.name} (x${returnQty})`
                    });
                    localStorage.setItem('pos_purchases_returns', JSON.stringify(purchaseReturnsDB));

                    Swal.fire('تم!', `تم الإرجاع وخصم ${refundAmount.toFixed(2)} ج.م من مديونية المورد`, 'success');
                    searchInvoice();
                    renderReturnsLog();
                }
            });
        }

        function renderReturnsLog() {
            const tbody = document.getElementById('returnsTableBody');
            if (purchaseReturnsDB.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 3rem; color: #94a3b8;">لا توجد مرتجعات مسجلة.</td></tr>';
                return;
            }
            tbody.innerHTML = [...purchaseReturnsDB].reverse().map(ret => `
                <tr>
                    <td><span style="color: var(--warning); font-weight: 900;">#PR-${ret.id}</span></td>
                    <td style="color: #64748b;">${ret.date}</td>
                    <td style="font-weight: bold;">${ret.supplierName}</td>
                    <td>${ret.itemsReturned}</td>
                    <td style="color: var(--danger); font-weight: 900;">- ${ret.refundTotal.toFixed(2)} ج.م</td>
                </tr>
            `).join('');
        }
    </script>
</body>

</html>
